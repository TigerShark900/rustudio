[package]
name = "rustudio-account"
description = "Roblox account layer for rustudio: OAuth 2.0 (PKCE) or Open Cloud API key, place listing, download and publishing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
keyring = "4"
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.23"
dirs = "6"
flate2 = "1"
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
